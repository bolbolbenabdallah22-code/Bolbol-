<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - Coach Bilel</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>COACH BILEL 💪</h1>

        <p id="welcome">
            Your Fitness Dashboard
        </p>


        <div class="day">

            <h2>📊 QUICK STATS</h2>

            <p id="weight">
                Weight: -
            </p>

            <p id="goal">
                Goal: -
            </p>

            <p id="progress">
                Progress: -
            </p>

            <p id="workouts">
                Workouts: 0
            </p>

        </div>


        <a class="program" href="programs.html">
            🏋️ MY PROGRAMS
        </a>


        <a class="program" href="workout.html">
            📅 MY WORKOUT
        </a>


        <a class="program" href="progress.html">
            📊 MY PROGRESS
        </a>


        <a class="program" href="profile.html">
            👤 MY PROFILE
        </a>


        <a class="program" href="calculator.html">
            🧮 CALCULATOR
        </a>


        <a class="back" href="index.html">
            ← HOME
        </a>

    </div>


    <script>

        const name =
            localStorage.getItem("name");

        const weight =
            Number(
                localStorage.getItem("weight")
            );

        const goalWeight =
            Number(
                localStorage.getItem("goalWeight")
            );

        const startingWeight =
            Number(
                localStorage.getItem(
                    "startingWeight"
                )
            );

        const workouts =
            Number(
                localStorage.getItem(
                    "workouts"
                )
            ) || 0;


        // WELCOME

        if (name) {

            document.getElementById(
                "welcome"
            ).textContent =
                "Welcome back, " +
                name +
                " 💪";

        }


        // WEIGHT

        if (weight > 0) {

            document.getElementById(
                "weight"
            ).textContent =
                "Weight: " +
                weight +
                " kg";

        }


        // GOAL

        if (goalWeight > 0) {

            document.getElementById(
                "goal"
            ).textContent =
                "Goal: " +
                goalWeight +
                " kg";

        }


        // PROGRESS

        if (
            startingWeight > 0 &&
            weight > 0 &&
            goalWeight > 0
        ) {

            const total =
                startingWeight -
                goalWeight;


            const lost =
                startingWeight -
                weight;


            let progress = 0;


            if (total > 0) {

                progress =
                    (
                        lost /
                        total
                    ) * 100;

            }


            const safeProgress =
                Math.max(
                    0,
                    Math.min(
                        100,
                        progress
                    )
                );


            document.getElementById(
                "progress"
            ).textContent =
                "Progress: " +
                safeProgress.toFixed(1) +
                "%";

        }


        // WORKOUTS

        document.getElementById(
            "workouts"
        ).textContent =
            "Workouts: " +
            workouts;

    </script>

</body>

</html>
