<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Workout - Coach Bilel</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🏋️ MY WORKOUT</h1>

        <p>Today's Training</p>


        <div class="day">

            <h2>🔥 CHEST + TRICEPS</h2>

            <p>🏋️ Bench Press</p>

            <input
                id="bench"
                type="number"
                placeholder="Weight (kg)"
            >

            <p>4 Sets × 10 Reps</p>


            <p>🏋️ Incline Dumbbell Press</p>

            <input
                id="incline"
                type="number"
                placeholder="Weight (kg)"
            >

            <p>3 Sets × 12 Reps</p>


            <p>🏋️ Cable Fly</p>

            <input
                id="fly"
                type="number"
                placeholder="Weight (kg)"
            >

            <p>3 Sets × 15 Reps</p>


            <p>💪 Triceps Pushdown</p>

            <input
                id="pushdown"
                type="number"
                placeholder="Weight (kg)"
            >

            <p>3 Sets × 12 Reps</p>


            <p>💪 Overhead Triceps Extension</p>

            <input
                id="extension"
                type="number"
                placeholder="Weight (kg)"
            >

            <p>3 Sets × 12 Reps</p>

        </div>


        <div class="day">

            <h2>⏱️ REST</h2>

            <p>
                Rest between sets:
                60–120 seconds
            </p>

        </div>


        <button onclick="completeWorkout()">
            ✅ COMPLETE WORKOUT
        </button>


        <p id="message"></p>


        <a class="back" href="dashboard.html">
            ← BACK
        </a>

    </div>


    <script>

        // Load saved weights

        document.getElementById("bench").value =
            localStorage.getItem("bench") || "";

        document.getElementById("incline").value =
            localStorage.getItem("incline") || "";

        document.getElementById("fly").value =
            localStorage.getItem("fly") || "";

        document.getElementById("pushdown").value =
            localStorage.getItem("pushdown") || "";

        document.getElementById("extension").value =
            localStorage.getItem("extension") || "";


        function completeWorkout() {

            // Save weights

            localStorage.setItem(
                "bench",
                document.getElementById("bench").value
            );

            localStorage.setItem(
                "incline",
                document.getElementById("incline").value
            );

            localStorage.setItem(
                "fly",
                document.getElementById("fly").value
            );

            localStorage.setItem(
                "pushdown",
                document.getElementById("pushdown").value
            );

            localStorage.setItem(
                "extension",
                document.getElementById("extension").value
            );


            // Count workout

            let workouts =
                Number(localStorage.getItem("workouts")) || 0;

            workouts++;


            localStorage.setItem(
                "workouts",
                workouts
            );


            localStorage.setItem(
                "workoutCompleted",
                "true"
            );


            document.getElementById("message").textContent =
                "🔥 Workout completed! Total: " +
                workouts;

        }

    </script>

</body>

    </html>
