workflows:
  android-build:
    name: Bolbol Fitness Android
    environment:
      node: 22
      java: 21

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Prepare web files
        script: |
          mkdir -p www
          cp *.html www/
          cp *.js www/
          cp *.css www/

      - name: Create Android project
        script: |
          rm -rf android
          npx cap add android

      - name: Sync Android
        script: |
          npx cap sync android

      - name: Build APK
        script: |
          cd android
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
