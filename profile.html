<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - Coach Bilel</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>👤 MY PROFILE</h1>

        <p>Enter your information</p>


        <div class="day">

            <input
                id="name"
                type="text"
                placeholder="Your Name"
            >


            <input
                id="age"
                type="number"
                placeholder="Age"
            >


            <input
                id="height"
                type="number"
                placeholder="Height (cm)"
            >


            <input
                id="weight"
                type="number"
                step="0.1"
                placeholder="Current Weight (kg)"
            >


            <input
                id="goalWeight"
                type="number"
                step="0.1"
                placeholder="Goal Weight (kg)"
            >


            <button onclick="saveProfile()">
                💾 SAVE PROFILE
            </button>

        </div>


        <div class="day">

            <h2>📌 STARTING WEIGHT</h2>

            <p id="startingWeight">
                Not set yet
            </p>

            <p>
                Starting weight is saved when
                you create your profile for
                the first time.
            </p>

        </div>


        <a class="back" href="dashboard.html">
            ← BACK
        </a>

    </div>


    <script>

        // Load saved information

        document.getElementById("name").value =
            localStorage.getItem("name") || "";

        document.getElementById("age").value =
            localStorage.getItem("age") || "";

        document.getElementById("height").value =
            localStorage.getItem("height") || "";

        document.getElementById("weight").value =
            localStorage.getItem("weight") || "";

        document.getElementById("goalWeight").value =
            localStorage.getItem("goalWeight") || "";


        // Show starting weight

        const savedStartingWeight =
            localStorage.getItem("startingWeight");


        if (savedStartingWeight) {

            document.getElementById(
                "startingWeight"
            ).textContent =
                savedStartingWeight +
                " kg";

        }


        function saveProfile() {

            const name =
                document.getElementById("name").value;

            const age =
                document.getElementById("age").value;

            const height =
                document.getElementById("height").value;

            const weight =
                document.getElementById("weight").value;

            const goalWeight =
                document.getElementById("goalWeight").value;


            if (
                !name ||
                !age ||
                !height ||
                !weight ||
                !goalWeight
            ) {

                alert(
                    "Please enter all information."
                );

                return;

            }


            // Save profile

            localStorage.setItem(
                "name",
                name
            );

            localStorage.setItem(
                "age",
                age
            );

            localStorage.setItem(
                "height",
                height
            );

            localStorage.setItem(
                "weight",
                weight
            );

            localStorage.setItem(
                "goalWeight",
                goalWeight
            );


            // Save starting weight only once

            if (
                !localStorage.getItem(
                    "startingWeight"
                )
            ) {

                localStorage.setItem(
                    "startingWeight",
                    weight
                );

            }


            document.getElementById(
                "startingWeight"
            ).textContent =
                localStorage.getItem(
                    "startingWeight"
                ) +
                " kg";


            alert(
                "Profile saved successfully! 💪🔥"
            );

        }

    </script>

</body>

    </html>
