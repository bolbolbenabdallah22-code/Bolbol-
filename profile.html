<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - Coach Bilel</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>👤 MY PROFILE</h1>

        <p>Enter your information</p>

        <div class="day">

            <input id="name" type="text" placeholder="Your Name">

            <input id="age" type="number" placeholder="Age">

            <input id="height" type="number" placeholder="Height (cm)">

            <input id="weight" type="number" placeholder="Weight (kg)">

            <input id="goal" type="text" placeholder="Your Goal">

            <button onclick="saveProfile()">
                💾 SAVE PROFILE
            </button>

        </div>

        <a class="back" href="dashboard.html">
            ← BACK
        </a>

    </div>

    <script>

        function saveProfile() {

            localStorage.setItem("name", document.getElementById("name").value);
            localStorage.setItem("age", document.getElementById("age").value);
            localStorage.setItem("height", document.getElementById("height").value);
            localStorage.setItem("weight", document.getElementById("weight").value);
            localStorage.setItem("goal", document.getElementById("goal").value);

            alert("Profile saved successfully! 💪🔥");
        }

    </script>

</body>

</html>
