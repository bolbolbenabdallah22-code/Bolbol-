<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator - Coach Bilel</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🧮 CALCULATOR</h1>

        <p>Calculate your calories</p>

        <div class="day">

            <input
                id="age"
                type="number"
                placeholder="Age"
            >

            <input
                id="height"
                type="number"
                placeholder="Height (cm)"
            >

            <input
                id="weight"
                type="number"
                step="0.1"
                placeholder="Weight (kg)"
            >

            <select id="gender">

                <option value="male">
                    Male
                </option>

                <option value="female">
                    Female
                </option>

            </select>

            <select id="activity">

                <option value="1.2">
                    Sedentary
                </option>

                <option value="1.375">
                    Light Activity
                </option>

                <option value="1.55">
                    Moderate Activity
                </option>

                <option value="1.725">
                    Very Active
                </option>

                <option value="1.9">
                    Extremely Active
                </option>

            </select>

            <button onclick="calculate()">
                🧮 CALCULATE
            </button>

        </div>


        <div class="day">

            <h2>🔥 RESULTS</h2>

            <p id="bmr">
                BMR: -
            </p>

            <p id="tdee">
                TDEE: -
            </p>

            <p id="calories">
                Fat Loss Calories: -
            </p>

        </div>


        <a class="back" href="dashboard.html">
            ← BACK
        </a>

    </div>


    <script>

        // Load information from MY PROFILE

        document.getElementById("age").value =
            localStorage.getItem("age") || "";

        document.getElementById("height").value =
            localStorage.getItem("height") || "";

        document.getElementById("weight").value =
            localStorage.getItem("weight") || "";


        function calculate() {

            const age =
                Number(document.getElementById("age").value);

            const height =
                Number(document.getElementById("height").value);

            const weight =
                Number(document.getElementById("weight").value);

            const gender =
                document.getElementById("gender").value;

            const activity =
                Number(document.getElementById("activity").value);


            if (!age || !height || !weight) {

                alert("Please enter all information.");

                return;
            }


            let bmr;


            if (gender === "male") {

                bmr =
                    (10 * weight) +
                    (6.25 * height) -
                    (5 * age) +
                    5;

            } else {

                bmr =
                    (10 * weight) +
                    (6.25 * height) -
                    (5 * age) -
                    161;

            }


            const tdee =
                bmr * activity;


            const fatLossCalories =
                tdee - 400;


            document.getElementById("bmr").textContent =
                "BMR: " + Math.round(bmr) + " kcal";


            document.getElementById("tdee").textContent =
                "TDEE: " + Math.round(tdee) + " kcal";


            document.getElementById("calories").textContent =
                "Fat Loss Calories: " +
                Math.round(fatLossCalories) +
                " kcal";

        }

    </script>

</body>

</html>
