<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator - Coach Bilel</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🧮 CALCULATOR</h1>

        <p>Calories • Macros • BMI</p>


        <!-- INPUTS -->

        <div class="day">

            <h2>👤 YOUR DATA</h2>

            <input
                id="age"
                type="number"
                placeholder="Age"
            >

            <input
                id="height"
                type="number"
                placeholder="Height (cm)"
            >

            <input
                id="weight"
                type="number"
                step="0.1"
                placeholder="Weight (kg)"
            >


            <select id="gender">

                <option value="male">
                    Male
                </option>

                <option value="female">
                    Female
                </option>

            </select>


            <select id="activity">

                <option value="1.2">
                    Sedentary
                </option>

                <option value="1.375">
                    Light Activity
                </option>

                <option value="1.55">
                    Moderate Activity
                </option>

                <option value="1.725">
                    Very Active
                </option>

                <option value="1.9">
                    Extremely Active
                </option>

            </select>


            <button onclick="calculate()">
                🧮 CALCULATE
            </button>

        </div>


        <!-- CALORIES -->

        <div class="day">

            <h2>🔥 CALORIE RESULTS</h2>

            <p id="bmr">
                BMR: -
            </p>

            <p id="tdee">
                TDEE: -
            </p>

            <p id="calories">
                Fat Loss Calories: -
            </p>

        </div>


        <!-- MACROS -->

        <div class="day">

            <h2>🥩 MACRO TARGETS</h2>

            <p id="protein">
                Protein: -
            </p>

            <p id="carbs">
                Carbs: -
            </p>

            <p id="fats">
                Fats: -
            </p>

        </div>


        <!-- BMI -->

        <div class="day">

            <h2>⚖️ BMI RESULTS</h2>

            <p id="bmi">
                BMI: -
            </p>

            <p id="bmiCategory">
                Category: -
            </p>

        </div>


        <a class="back" href="dashboard.html">
            ← BACK TO DASHBOARD
        </a>

    </div>


    <script>

        // =========================
        // LOAD PROFILE DATA
        // =========================

        document.getElementById("age").value =
            localStorage.getItem("age") || "";


        document.getElementById("height").value =
            localStorage.getItem("height") || "";


        document.getElementById("weight").value =
            localStorage.getItem("weight") || "";


        document.getElementById("gender").value =
            localStorage.getItem("gender") || "male";


        document.getElementById("activity").value =
            localStorage.getItem("activity") || "1.2";


        // =========================
        // CALCULATE
        // =========================

        function calculate() {

            const age =
                Number(
                    document.getElementById(
                        "age"
                    ).value
                );


            const height =
                Number(
                    document.getElementById(
                        "height"
                    ).value
                );


            const weight =
                Number(
                    document.getElementById(
                        "weight"
                    ).value
                );


            const gender =
                document.getElementById(
                    "gender"
                ).value;


            const activity =
                Number(
                    document.getElementById(
                        "activity"
                    ).value
                );


            // =========================
            // VALIDATION
            // =========================

            if (
                !age ||
                !height ||
                !weight
            ) {

                alert(
                    "Please enter all information."
                );

                return;

            }


            // =========================
            // SAVE PROFILE DATA
            // =========================

            localStorage.setItem(
                "age",
                age
            );


            localStorage.setItem(
                "height",
                height
            );


            localStorage.setItem(
                "weight",
                weight
            );


            localStorage.setItem(
                "gender",
                gender
            );


            localStorage.setItem(
                "activity",
                activity
            );


            // =========================
            // BMR
            // =========================

            let bmr;


            if (
                gender === "male"
            ) {

                bmr =
                    (10 * weight) +
                    (6.25 * height) -
                    (5 * age) +
                    5;

            } else {

                bmr =
                    (10 * weight) +
                    (6.25 * height) -
                    (5 * age) -
                    161;

            }


            // =========================
            // TDEE
            // =========================

            const tdee =
                bmr * activity;


            // =========================
            // FAT LOSS CALORIES
            // =========================

            const fatLossCalories =
                Math.round(
                    tdee - 400
                );


            // =========================
            // PROTEIN
            // =========================

            const protein =
                Math.round(
                    weight * 2
                );


            // =========================
            // FAT
            // =========================

            const fats =
                Math.round(
                    (fatLossCalories * 0.25) / 9
                );


            // =========================
            // CARBS
            // =========================

            const proteinCalories =
                protein * 4;


            const fatCalories =
                fats * 9;


            const remainingCalories =
                fatLossCalories -
                proteinCalories -
                fatCalories;


            const carbs =
                Math.max(
                    0,
                    Math.round(
                        remainingCalories / 4
                    )
                );


            // =========================
            // BMI
            // =========================

            const heightMeters =
                height / 100;


            const bmi =
                weight /
                (
                    heightMeters *
                    heightMeters
                );


            let category;


            if (bmi < 18.5) {

                category =
                    "Underweight";

            } else if (bmi < 25) {

                category =
                    "Normal Weight";

            } else if (bmi < 30) {

                category =
                    "Overweight";

            } else {

                category =
                    "Obesity";

            }


            // =========================
            // SAVE RESULTS
            // =========================

            localStorage.setItem(
                "bmr",
                Math.round(bmr)
            );


            localStorage.setItem(
                "tdee",
                Math.round(tdee)
            );


            localStorage.setItem(
                "calories",
                fatLossCalories
            );


            localStorage.setItem(
                "protein",
                protein
            );


            localStorage.setItem(
                "carbs",
                carbs
            );


            localStorage.setItem(
                "fats",
                fats
            );


            localStorage.setItem(
                "bmi",
                bmi.toFixed(1)
            );


            localStorage.setItem(
                "bmiCategory",
                category
            );


            // =========================
            // DISPLAY RESULTS
            // =========================

            document.getElementById(
                "bmr"
            ).textContent =
                "BMR: " +
                Math.round(bmr) +
                " kcal";


            document.getElementById(
                "tdee"
            ).textContent =
                "TDEE: " +
                Math.round(tdee) +
                " kcal";


            document.getElementById(
                "calories"
            ).textContent =
                "Fat Loss Calories: " +
                fatLossCalories +
                " kcal";


            document.getElementById(
                "protein"
            ).textContent =
                "Protein: " +
                protein +
                " g";


            document.getElementById(
                "carbs"
            ).textContent =
                "Carbs: " +
                carbs +
                " g";


            document.getElementById(
                "fats"
            ).textContent =
                "Fats: " +
                fats +
                " g";


            document.getElementById(
                "bmi"
            ).textContent =
                "BMI: " +
                bmi.toFixed(1);


            document.getElementById(
                "bmiCategory"
            ).textContent =
                "Category: " +
                category;


            alert(
                "Calculator updated successfully! 🔥💪"
            );

        }


        // =========================
        // LOAD SAVED RESULTS
        // =========================

        const savedBmr =
            localStorage.getItem("bmr");


        const savedTdee =
            localStorage.getItem("tdee");


        const savedCalories =
            localStorage.getItem("calories");


        const savedProtein =
            localStorage.getItem("protein");


        const savedCarbs =
            localStorage.getItem("carbs");


        const savedFats =
            localStorage.getItem("fats");


        const savedBmi =
            localStorage.getItem("bmi");


        const savedBmiCategory =
            localStorage.getItem(
                "bmiCategory"
            );


        if (savedBmr) {

            document.getElementById(
                "bmr"
            ).textContent =
                "BMR: " +
                savedBmr +
                " kcal";

        }


        if (savedTdee) {

            document.getElementById(
                "tdee"
            ).textContent =
                "TDEE: " +
                savedTdee +
                " kcal";

        }


        if (savedCalories) {

            document.getElementById(
                "calories"
            ).textContent =
                "Fat Loss Calories: " +
                savedCalories +
                " kcal";

        }


        if (savedProtein) {

            document.getElementById(
                "protein"
            ).textContent =
                "Protein: " +
                savedProtein +
                " g";

        }


        if (savedCarbs) {

            document.getElementById(
                "carbs"
            ).textContent =
                "Carbs: " +
                savedCarbs +
                " g";

        }


        if (savedFats) {

            document.getElementById(
                "fats"
            ).textContent =
                "Fats: " +
                savedFats +
                " g";

        }


        if (savedBmi) {

            document.getElementById(
                "bmi"
            ).textContent =
                "BMI: " +
                savedBmi;

        }


        if (savedBmiCategory) {

            document.getElementById(
                "bmiCategory"
            ).textContent =
                "Category: " +
                savedBmiCategory;

        }

    </script>

</body>

                </html>
