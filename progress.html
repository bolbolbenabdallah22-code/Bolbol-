<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Progress - Coach Bilel</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>📊 MY PROGRESS</h1>

        <p>Track your fitness progress</p>

        <div class="day">
            <h2>👤 PROFILE</h2>
            <p id="name">Not set yet</p>
        </div>

        <div class="day">
            <h2>⚖️ CURRENT WEIGHT</h2>
            <p id="currentWeight">Not set yet</p>
        </div>

        <div class="day">
            <h2>🎯 GOAL WEIGHT</h2>
            <p id="goalWeight">Not set yet</p>
        </div>

        <div class="day">
            <h2>📉 WEIGHT DIFFERENCE</h2>
            <p id="difference">Not available</p>
        </div>

        <div class="day">
            <h2>📈 PROGRESS</h2>
            <p id="progressPercent">Not available</p>
        </div>

        <div class="day">
            <h2>🏆 WORKOUTS COMPLETED</h2>
            <p id="workouts">0 workouts</p>
        </div>

        <a class="back" href="dashboard.html">
            ← BACK
        </a>

    </div>

    <script>

        const name = localStorage.getItem("name");
        const weight = Number(localStorage.getItem("weight"));
        const goalWeight = Number(localStorage.getItem("goalWeight"));
        const workouts =
            Number(localStorage.getItem("workouts")) || 0;


        // Profile
        if (name) {
            document.getElementById("name").textContent = name;
        }


        // Current Weight
        if (weight > 0) {
            document.getElementById("currentWeight").textContent =
                weight + " kg";
        }


        // Goal Weight
        if (goalWeight > 0) {

            document.getElementById("goalWeight").textContent =
                goalWeight + " kg";


            // Weight Difference
            if (weight > 0) {

                const difference =
                    weight - goalWeight;

                document.getElementById("difference").textContent =
                    difference.toFixed(1) + " kg";


                // Progress %
                if (weight > goalWeight) {

                    const progress =
                        ((weight - goalWeight) / weight) * 100;

                    document.getElementById("progressPercent").textContent =
                        progress.toFixed(1) + "%";

                } else {

                    document.getElementById("progressPercent").textContent =
                        "100%";

                }

            }

        }


        // Workouts
        document.getElementById("workouts").textContent =
            workouts +
            (workouts === 1 ? " workout" : " workouts");

    </script>

</body>

</html>
