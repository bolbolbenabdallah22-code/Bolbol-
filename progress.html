<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Progress - Coach Bilel</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>📊 MY PROGRESS</h1>

        <p>Track your fitness progress</p>


        <div class="day">

            <h2>👤 PROFILE</h2>

            <p id="name">Not set yet</p>

            <p id="age">Age: -</p>

            <p id="height">Height: -</p>

        </div>


        <div class="day">

            <h2>⚖️ WEIGHT</h2>

            <p id="currentWeight">
                Current Weight: -
            </p>

            <p id="goalWeight">
                Goal Weight: -
            </p>

            <p id="difference">
                Weight Difference: -
            </p>

        </div>


        <div class="day">

            <h2>📈 PROGRESS</h2>

            <p id="progressPercent">
                Progress: -
            </p>

        </div>


        <div class="day">

            <h2>🔥 BODY & CALORIES</h2>

            <p id="bmi">
                BMI: -
            </p>

            <p id="bmiCategory">
                Category: -
            </p>

            <p id="bmr">
                BMR: -
            </p>

            <p id="tdee">
                TDEE: -
            </p>

            <p id="calories">
                Fat Loss Calories: -
            </p>

        </div>


        <div class="day">

            <h2>🏆 WORKOUTS COMPLETED</h2>

            <p id="workouts">
                0 workouts
            </p>

        </div>


        <a class="back" href="dashboard.html">
            ← BACK
        </a>

    </div>


    <script>

        // Get saved profile data

        const name =
            localStorage.getItem("name") || "";

        const age =
            Number(localStorage.getItem("age"));

        const height =
            Number(localStorage.getItem("height"));

        const weight =
            Number(localStorage.getItem("weight"));

        const goalWeight =
            Number(localStorage.getItem("goalWeight"));

        const workouts =
            Number(localStorage.getItem("workouts")) || 0;


        // Profile

        if (name) {

            document.getElementById("name").textContent =
                name;

        }


        if (age > 0) {

            document.getElementById("age").textContent =
                "Age: " + age;

        }


        if (height > 0) {

            document.getElementById("height").textContent =
                "Height: " + height + " cm";

        }


        // Weight

        if (weight > 0) {

            document.getElementById("currentWeight").textContent =
                "Current Weight: " +
                weight +
                " kg";

        }


        if (goalWeight > 0) {

            document.getElementById("goalWeight").textContent =
                "Goal Weight: " +
                goalWeight +
                " kg";

        }


        // Weight Difference

        if (weight > 0 && goalWeight > 0) {

            const difference =
                weight - goalWeight;

            document.getElementById("difference").textContent =
                "Weight Difference: " +
                difference.toFixed(1) +
                " kg";


            // Progress

            if (difference <= 0) {

                document.getElementById("progressPercent").textContent =
                    "Goal Reached! 🏆";

            } else {

                const progress =
                    ((weight - goalWeight) / weight) * 100;

                document.getElementById("progressPercent").textContent =
                    "Progress: " +
                    progress.toFixed(1) +
                    "%";

            }

        }


        // BMI + Calories

        if (weight > 0 && height > 0 && age > 0) {

            const heightMeters =
                height / 100;


            const bmi =
                weight /
                (heightMeters * heightMeters);


            let category;


            if (bmi < 18.5) {

                category = "Underweight";

            } else if (bmi < 25) {

                category = "Normal Weight";

            } else if (bmi < 30) {

                category = "Overweight";

            } else {

                category = "Obesity";

            }


            document.getElementById("bmi").textContent =
                "BMI: " +
                bmi.toFixed(1);


            document.getElementById("bmiCategory").textContent =
                "Category: " +
                category;


            // Use male as default

            const bmr =
                (10 * weight) +
                (6.25 * height) -
                (5 * age) +
                5;


            const tdee =
                bmr * 1.2;


            const calories =
                tdee - 400;


            document.getElementById("bmr").textContent =
                "BMR: " +
                Math.round(bmr) +
                " kcal";


            document.getElementById("tdee").textContent =
                "TDEE: " +
                Math.round(tdee) +
                " kcal";


            document.getElementById("calories").textContent =
                "Fat Loss Calories: " +
                Math.round(calories) +
                " kcal";

        }


        // Workouts

        document.getElementById("workouts").textContent =
            workouts +
            (workouts === 1
                ? " workout"
                : " workouts");

    </script>

</body>

                </html>
